<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scroll Car Animation</title>

    <link rel="stylesheet" href="ass.css">

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>

    <section class="section">

        <div class="track">

            <div class="road" id="road">

                <!-- CAR -->
                <img
                    <img
                         src="./view.png"
                         alt="McLaren"
                         class="car"
                         id="car">
                >

                <!-- GREEN TRAIL -->
                <div class="trail" id="trail"></div>

                <!-- HEADLINE -->
                <div class="value-add" id="valueText">

                    <span class="value-letter">W</span>
                    <span class="value-letter">E</span>
                    <span class="value-letter">L</span>
                    <span class="value-letter">C</span>
                    <span class="value-letter">O</span>
                    <span class="value-letter">M</span>
                    <span class="value-letter">E</span>

                    <span class="value-letter">&nbsp;</span>

                    <span class="value-letter">I</span>
                    <span class="value-letter">T</span>
                    <span class="value-letter">Z</span>
                    <span class="value-letter">F</span>
                    <span class="value-letter">I</span>
                    <span class="value-letter">Z</span>
                    <span class="value-letter">Z</span>

                </div>

            </div>

            <!-- STAT 1 -->
            <div class="text-box" id="box1">
                <span class="num-box">58%</span>
                <span>Increase in pick up point use</span>
            </div>

            <!-- STAT 2 -->
            <div class="text-box" id="box2">
                <span class="num-box">23%</span>
                <span>Decreased in customer phone calls</span>
            </div>

            <!-- STAT 3 -->
            <div class="text-box" id="box3">
                <span class="num-box">27%</span>
                <span>Increase in pick up point use</span>
            </div>

            <!-- STAT 4 -->
            <div class="text-box" id="box4">
                <span class="num-box">40%</span>
                <span>Decreased in customer phone calls</span>
            </div>

        </div>

    </section>

    <section class="next-section">
        <h2>Next Section</h2>
    </section>

    <!-- YOUR JAVASCRIPT -->
    <script src="ass.js"></script>

</body>
</html>
